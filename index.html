<!DOCTYPE html>
<html>
    <form action="Ok.html" method="gets">
     <head><title>form for information</title>
   <link rel="stylesheet" href="style.css"></head>
    <body><h1><marquee>Fill the required details correctly </marquee></h1>
    <div class="form-wrapper"> 
    <h3>
    <label for="name">Name</label>
    <input type="text" id="name" name="nm" placeholder="*****"></br>
        <!-- for class -->
    <label for="class">Class</label>
    <input type="number" id="class" name="cls" min="1" max="12"  required placeholder="*"></br>
    <!-- for email -->
    <label for="email">Email</label>
    <input type="email" id="email" name="em" required placeholder="****"></br>
    <!-- for date of birth -->
    <label for="DOB">Date of Birth</label>
    <input type="date" id="DOB" name="dob" required placeholder="****"></br>
     <!-- for address -->
    <label for="address">Address</label>
    <input type="text" id="location" name="loc" required placeholder="****"></br>
     <!-- for gender -->
    Gender<br />
    Boy<input type="radio" id="boy" name="gnd"> &nbsp;
    Girl<input type="radio" id="girl" name="gnd">&nbsp;
    Other<input type="radio" id="other" name="gnd"></br>
    <!-- for submition and reset -->
    <button type="submit" class="btn" >Submit</button> &nbsp;
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <button type="reset" class="btn">Reset</button></br>
  </div>
   </h3>
    </body>
   </form>

</html>
